# =====================================================================================
#  PIMCORE AUTO TOOL - FILE CẤU HÌNH SELECTOR & THỜI GIAN
# =====================================================================================
#  Thứ tự ưu tiên khi tool nạp file:
#    1) File "selectors.properties" nằm CÙNG THƯ MỤC chạy tool (cạnh file .jar)  -> ưu tiên
#    2) Nếu không có -> dùng bản mặc định đóng gói sẵn trong file .jar
#  Bấm nút "Mở selectors.properties" trên tool để tự xuất bản mặc định ra ngoài và sửa.
#  Sửa xong bấm "Nạp lại selectors" (hoặc chỉ cần bấm Start, tool tự nạp lại).
#
#  CÚ PHÁP GIÁ TRỊ SELECTOR:
#    xpath://div[@id='abc']      -> XPath (dán XPath copy từ F12 vào sau "xpath:")
#    css:#abc .item              -> CSS Selector
#    id:abc                      -> theo id
#    name:abc                    -> theo thuộc tính name
#    Không có tiền tố: bắt đầu bằng "/" hoặc "(" => XPath, còn lại => CSS.
#
#  BIẾN THAY THẾ (placeholder) tool tự điền lúc chạy:
#    {folder}  = Tên thư mục Pimcore nhập trên giao diện (mặc định 2025)
#    {value}   = Giá trị cần chọn (Vietnamese / Web ...)
#    {row}     = Số dòng hiện tại trên Google Sheet
#    {index}   = Số thứ tự bài đang chạy (1, 2, 3 ...)
#
#  LƯU Ý: Tool luôn chọn phần tử ĐANG HIỂN THỊ đầu tiên khớp selector (bỏ qua phần tử
#  ẩn của các tab Pimcore khác), nên XPath có thể khớp nhiều phần tử mà vẫn chạy đúng.
#  File đọc theo UTF-8, có thể viết tiếng Việt có dấu trực tiếp.
# =====================================================================================


# ------------------------------- NHẬN DIỆN TAB -------------------------------------
# Mỗi giá trị có thể ghi nhiều chuỗi cách nhau dấu phẩy. Tab khớp nếu URL chứa 1 trong các
# chuỗi urlContains HOẶC tiêu đề tab chứa 1 trong các chuỗi titleContains.
tab.sheet.urlContains=docs.google.com/spreadsheets
tab.sheet.titleContains=
tab.pimcore.urlContains=/admin
tab.pimcore.titleContains=Pimcore
tab.appscript.urlContains=script.google.com/macros,script.googleusercontent.com
tab.appscript.titleContains=Web App Script

# Đường dẫn chrome.exe (để trống = tự dò các vị trí cài đặt mặc định)
chrome.path=


# ------------------------------- GOOGLE SHEET (Bước 1-3) ---------------------------
# Phần tử báo hiệu Sheet đã tải xong
sheet.readyIndicator=css:#t-name-box
# Ô "Name Box" góc trên bên trái Sheet (tool gõ địa chỉ ô, ví dụ B2, rồi Enter để chọn ô)
sheet.nameBox=css:#t-name-box
# Đường link Google Doc hiển thị trong bong bóng link khi ô có hyperlink được chọn
sheet.docLink=xpath://a[contains(@href,'/document/d/') or contains(@href,'%2Fdocument%2Fd%2F')]


# ------------------------------- GOOGLE DOC (Bước 4, 16-17) ------------------------
doc.readyIndicator=css:.kix-appview-editor
# Selector trực tiếp tới dòng tiêu đề bôi đậm đầu tiên.
# Để TRỐNG = tự động: (a) quét DOM trình soạn thảo tìm chữ đậm đầu tiên,
#                     (b) nếu Google Doc render dạng canvas -> mở chế độ xem HTML (mobilebasic)
#                         trong tab phụ để đọc dòng đậm đầu tiên rồi đóng tab phụ.
doc.firstBoldTitle=


# ------------------------------- PIMCORE (Bước 5-15) -------------------------------
# Thư mục trên cây Data Objects (chuột phải vào đây). Nếu cây của bạn có id khác, có thể dùng
# bản tổng quát: xpath://span[contains(@class,'x-tree-node-text') and normalize-space()='{folder}']
pimcore.treeFolder=xpath://div[starts-with(@id,'pimcore_panel_tree_objects')]//span[contains(@class,'x-tree-node-text') and normalize-space()='{folder}']
# Menu chuột phải
pimcore.menuAddObject=xpath://div[contains(@class,'x-menu')]//span[contains(@class,'x-menu-item-text') and normalize-space()='Add Object']
pimcore.menuNewsClass=xpath://div[contains(@class,'x-menu')]//span[contains(@class,'x-menu-item-text') and normalize-space()='News']

# Hộp thoại Pimcore hỏi tên (key) object mới sau khi chọn "News".
# true = nếu hộp thoại xuất hiện, tool dán tiêu đề bài làm tên rồi bấm OK. false = bỏ qua.
pimcore.addObject.handlePrompt=true
pimcore.addObject.promptInput=xpath://div[contains(@class,'x-message-box') or contains(@class,'x-window')]//input[contains(@class,'x-form-field') and not(@type='hidden')]
pimcore.addObject.promptOk=xpath://div[contains(@class,'x-message-box') or contains(@class,'x-window')]//span[contains(@class,'x-btn-inner') and normalize-space()='OK']

# Ô "Tiêu đề" trong tab Base
pimcore.titleInput=xpath://label[contains(@class,'x-form-item-label')][contains(normalize-space(.),'Tiêu đề')]/following-sibling::div[1]//*[self::input or self::textarea]
# Tab "SEO" và ô "SEO Title"
pimcore.tabSeo=xpath://span[contains(@class,'x-tab-inner') and normalize-space()='SEO']
pimcore.seoTitleInput=xpath://label[contains(@class,'x-form-item-label')][contains(normalize-space(.),'SEO Title')]/following-sibling::div[1]//*[self::input or self::textarea]
# Nút "Save & Publish"
pimcore.btnSavePublish=xpath://span[contains(@class,'x-btn-inner') and normalize-space()='Save & Publish']
# Lớp phủ loading khi Pimcore đang xử lý (tool chờ đến khi biến mất)
pimcore.loadingMask=xpath://div[contains(@class,'x-mask-msg')]
# Thông báo lưu thành công (chỉ để ghi log, không thấy cũng không báo lỗi). Để trống = bỏ qua.
pimcore.saveSuccess=xpath://*[contains(text(),'Saved successfully') or contains(text(),'saved successfully') or contains(text(),'Đã lưu')]
# Tab "Base"
pimcore.tabBase=xpath://span[contains(@class,'x-tab-inner') and normalize-space()='Base']
# Ô ngày trong mục "Thời gian"
pimcore.dateInput=xpath://label[contains(@class,'x-form-item-label')][contains(normalize-space(.),'Thời gian')]/following-sibling::div[1]//input[not(@type='hidden')]
# "Ngôn ngữ hiển thị": nút mũi tên mở danh sách + mục cần chọn
pimcore.languageTrigger=xpath://label[contains(@class,'x-form-item-label')][contains(normalize-space(.),'Ngôn ngữ hiển thị')]/following-sibling::div[1]//div[contains(@class,'x-form-trigger')]
pimcore.languageItem=xpath://li[contains(@class,'x-boundlist-item') and normalize-space()='{value}']
# "Access Channel": nếu là danh sách hiển thị sẵn (multiselect không có mũi tên) thì để TRỐNG accessChannelTrigger
pimcore.accessChannelTrigger=xpath://label[contains(@class,'x-form-item-label')][contains(normalize-space(.),'Access Channel')]/following-sibling::div[1]//div[contains(@class,'x-form-trigger')]
pimcore.accessChannelItem=xpath://li[contains(@class,'x-boundlist-item') and normalize-space()='{value}']


# ------------------------------- PIMCORE SYNC (Bước 18-24) -------------------------
# Các phần tử này được tìm cả trong iframe (nếu Pimcore nhúng form trong iframe).
pimcore.syncGoogleDocMenu=xpath://span[(contains(@class,'x-tab-inner') or contains(@class,'x-btn-inner') or contains(@class,'x-menu-item-text') or contains(@class,'x-panel-header-text') or contains(@class,'x-tree-node-text')) and normalize-space()='Sync data Google doc']
pimcore.syncGoogleDocIdInput=xpath://label[contains(normalize-space(.),'ID Google doc')]/following-sibling::div[1]//*[self::input or self::textarea]
pimcore.syncSendButton=xpath://span[contains(@class,'x-btn-inner') and normalize-space()='Gửi'] | //button[normalize-space()='Gửi'] | //input[@type='submit' and @value='Gửi']
# Khung nội dung bài viết (CKEditor inline / CKEditor iframe / TinyMCE iframe)
pimcore.articleBody=xpath://div[contains(@class,'cke_editable') and @contenteditable='true'] | //iframe[contains(@class,'cke_wysiwyg_frame') or contains(@class,'tox-edit-area__iframe')]
# Nút "Source" trên thanh công cụ trình soạn thảo
pimcore.sourceButton=xpath://a[contains(@class,'cke_button__source') or contains(@class,'cke_button__sourcedialog')] | //button[@aria-label='Source code' or @title='Source code' or @aria-label='Source']
# Ô chứa mã HTML sau khi bấm Source
pimcore.sourceTextarea=xpath://textarea[contains(@class,'cke_source')] | //div[contains(@class,'cke_dialog')]//textarea | //div[contains(@class,'tox-dialog')]//textarea
# (Tùy chọn) Nút đóng hộp thoại Source sau khi copy. Để TRỐNG = không bấm (đúng 27 bước gốc).
pimcore.sourceDialogClose=


# ------------------------------- WEB APP SCRIPT (Bước 25-27) -----------------------
# Web App Apps Script chạy trong iframe lồng nhau -> tool tự dò iframe.
appscript.menuEditSource=xpath://*[self::a or self::button or self::li or self::span or self::div][translate(normalize-space(.),'S','s')='sửa source']
appscript.sourceEditor=xpath://textarea[not(@readonly) and not(@disabled)] | //div[contains(@class,'CodeMirror')] | //div[contains(@class,'ace_editor')] | //*[@contenteditable='true']


# ------------------------------- THỜI GIAN (giây / mili-giây) ----------------------
timing.defaultTimeoutSec=20
timing.actionDelayMs=700
timing.newTabTimeoutSec=15
timing.pageLoadTimeoutSec=40
timing.sheetLinkPopupMs=1500
timing.docTitleSelectorWaitSec=5
timing.promptWaitSec=5
timing.saveMaskTimeoutSec=90
timing.afterSaveWaitMs=2500
timing.clipboardWaitMs=3000
timing.betweenArticlesMs=2000
